name: OpenJobFill CI & Benchmark Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests & Semantic Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Compile Check
        run: pnpm compile

      - name: Run Vitest Unit Tests & Benchmarks
        run: pnpm test

      - name: Run Extension Build Check
        run: pnpm build

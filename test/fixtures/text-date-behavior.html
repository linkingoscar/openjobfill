<!doctype html><meta charset="utf-8"><title>Local synthetic control behavior lab</title>
<style>body{font:16px system-ui;padding:24px}label{display:block;margin:14px 0}input,textarea{padding:8px;border:1px solid #777}fieldset{margin:20px 0}</style>
<h1>Local synthetic recruitment controls</h1><p>No network submission. Every value is test data.</p><div id="app"></div>
<script src="/node_modules/vue/dist/vue.global.prod.js"></script>
<script>
const mode=new URLSearchParams(location.search).get('case')||'vue';
const app=document.querySelector('#app');
if(mode==='vue') {
 Vue.createApp({data:()=>({candidateName:'',email:'',phone:'',gender:'',birthDate:'',acceptOvertime:false,summary:''}),template:`<form @submit.prevent><label>姓名<input name="candidateName" v-model="candidateName"></label><label>电子邮箱<input type="email" name="email" v-model="email"></label><label>手机号码<input type="tel" name="phone" v-model="phone"></label><fieldset><legend>性别</legend><label><input type="radio" name="gender" value="男" v-model="gender">男</label><label><input type="radio" name="gender" value="女" v-model="gender">女</label></fieldset><label>出生日期<input type="date" name="birthDate" v-model="birthDate"></label><label>是否接受加班<input type="checkbox" name="acceptOvertime" v-model="acceptOvertime"></label><label>自我评价<textarea name="summary" v-model="summary"></textarea></label><output id="model">{{JSON.stringify({candidateName,email,phone,gender,birthDate,acceptOvertime,summary})}}</output></form>`}).mount(app);
} else {
 app.innerHTML='<form><div class="form-item"><label for="name">姓名</label><input id="name" name="candidateName"></div></form>';
 const input=document.querySelector('#name');
 if(mode==='cancel-main'){input.className='phoenix-input';input.addEventListener('beforeinput',e=>e.preventDefault());}
 if(mode==='cancel')input.addEventListener('beforeinput',e=>e.preventDefault());
 if(mode==='rerender')input.addEventListener('input',()=>{const replacement=input.cloneNode();replacement.value='';input.replaceWith(replacement)}, {once:true});
 if(mode==='debounced')input.addEventListener('blur',()=>setTimeout(()=>{input.value='';input.setAttribute('aria-invalid','true');},120));
 if(mode==='invalid')input.addEventListener('blur',()=>input.setAttribute('aria-invalid','true'));
 if(mode==='radio')app.innerHTML='<form><label>手机号码<input type="tel" name="phone" v-model="phone"></label><fieldset><legend>性别</legend><label><input type="radio" name="gender" value="非男">非男</label><label><input type="radio" name="gender" value="男">男</label></fieldset></form>';
 if(mode==='editor'){app.innerHTML='<form><label>自我评价<div id="editor" contenteditable="true" role="textbox"></div></label></form>';window.committedEditor='';document.querySelector('#editor').addEventListener('input',e=>window.committedEditor=e.target.innerText);}
 if(mode==='calendar'){app.innerHTML='<form><div class="form-item"><label>出生日期</label><div class="ant-picker"><input readonly placeholder="出生日期"></div></div></form><div class="ant-picker-dropdown" hidden><button type="button" data-date="2001-05-18">18</button></div>';const date=document.querySelector('input'),popup=document.querySelector('.ant-picker-dropdown');window.committedDate='';date.addEventListener('click',()=>popup.hidden=false);document.querySelector('[data-date]').addEventListener('click',()=>{window.committedDate=date.value='2001-05-18';popup.hidden=true;});}
 if(mode==='checkbox'){app.innerHTML='<form><label>是否接受加班<input type="checkbox" name="acceptOvertime"></label></form>';document.querySelector('input').addEventListener('click',e=>e.preventDefault());}
}
</script>
